<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Guadalupe Cano - Dev Web Full Stack especializada en React, Node.js e integración de IA. Transformando ideas en productos digitales." />
  <meta name="keywords"
    content="dev web, full stack, React, Node.js, inteligencia artificial, automatización, portfolio" />
  <meta name="author" content="Guadalupe Cano" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://guadalupecano.es/" />
  <meta property="og:title" content="Guadalupe Cano | Dev Web Full Stack" />
  <meta property="og:description"
    content="Desarrolladora Full Stack especializada en React, Node.js e IA. Soluciones web modernas, eficientes y bien construidas." />
  <meta property="og:image" content="/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://guadalupecano.es/" />
  <meta property="twitter:title" content="Guadalupe Cano | Dev Web Full Stack" />
  <meta property="twitter:description"
    content="Desarrolladora Full Stack especializada en React, Node.js e IA. Soluciones web modernas, eficientes y bien construidas." />
  <meta property="twitter:image" content="/og-image.jpg" />

  <!-- Theme Color -->
  <meta name="theme-color" content="#dccbf0" />

  <!-- PWA: instalable en Android (manifest) y en iPhone (meta de Apple, que Safari lee por separado) -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Valle del Bucle" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />

  <script>
    // Tema inicial antes de pintar, para que no haya parpadeo. Misma clave y valores que ThemeContext.jsx.
    (function () {
      var theme = 'valle';
      try {
        var saved = localStorage.getItem('valle-del-bucle:theme');
        if (saved === 'dark' || saved === 'light' || saved === 'valle') theme = saved;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') document.documentElement.classList.add('dark');
    })();
    // Tema del juego (Aventura o Cozy) en la portada y el valle, que son las únicas rutas que lo usan: así el
    // primer pintado ya lleva su fondo. Misma clave y valores que lib/gameTheme.js; GameThemeScope lo mantiene después.
    (function () {
      var path = location.pathname.replace(/\/+$/, '') || '/';
      if (path !== '/' && path !== '/valle') return;
      var game = 'aventura';
      try {
        var saved = localStorage.getItem('valle-del-bucle:game-theme');
        if (saved === 'cozy') game = saved;
      } catch (e) {}
      document.documentElement.setAttribute('data-game-theme', game);
    })();
  </script>

  <!-- El enlace de saltar al contenido está en el HTML estático y se vería un instante hasta que
       cargue la hoja de estilos; esta regla mínima lo oculta desde el primer pintado. Al recibir
       foco con el teclado reaparece (los estilos completos están en src/index.css). -->
  <style>
    .skip-link { position: absolute; top: -40px; left: 0; }
    .skip-link:focus { top: 0; }
  </style>

  <title>Guadalupe Cano | Dev Web Full Stack</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
</head>

<body>
  <!-- Skip to main content (Accesibilidad) -->
  <a href="#main-content" class="skip-link">Saltar al contenido principal</a>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
